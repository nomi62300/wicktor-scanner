name: Signal journal scan

# Runs the scanner headlessly so the journal records the market rather than
# the owner's browsing hours. Before this existed, signals were only logged
# while a signed-in tab happened to be open, which silently deleted whole
# sessions (overnight, weekends) from the evidence.
#
# GitHub's scheduler is best-effort: 5 minutes is the floor, and runs are
# routinely delayed or skipped when the platform is busy. That is acceptable
# here — a missed run loses one sampling opportunity, and the unique key on
# (symbol, market, direction, bar_time) means a late or duplicated run
# cannot double-count. It is NOT a guarantee of even 5-minute spacing, so
# nothing downstream should assume a fixed cadence.
#
# Note: GitHub disables scheduled workflows in repos with no commit activity
# for 60 days. If the journal goes quiet, check that before debugging code.
#
# ---------------------------------------------------------------------------
# THE SCHEDULE IS DELIBERATELY OFF. Bybit 403s every request from GitHub's
# hosted runners — measured, both api.bybit.com and api.bytick.com, so it is
# the runner's US cloud IP being blocked rather than one bad hostname. The
# scan itself is correct and runs fine anywhere Bybit answers (verified
# locally and against production Supabase); it simply cannot run HERE.
#
# Supabase's own region (ap-northeast-1) reaches Bybit fine — measured with a
# throwaway probe function — so an Edge Function is the natural home. That
# move is blocked on a real port, not a config change: js/indicators.js and
# friends are sloppy-mode browser IIFEs and Deno evaluates ESM in strict
# mode, so they fail at boot before any scan starts.
#
# Left dispatchable so it can be run by hand from a machine-independent
# place the moment a reachable runner exists.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      universe_size:
        description: 'Coins per category to scan'
        required: false
        default: '120'
      dry_run:
        description: 'Score without writing (1 = dry run)'
        required: false
        default: '0'

# A slow run must never stack on top of the next scheduled one — two
# concurrent scans would just contend for the same rows.
concurrency:
  group: signal-journal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scan and journal signals
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNIVERSE_SIZE: ${{ github.event.inputs.universe_size || '120' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: node tools/cron-scan.js
