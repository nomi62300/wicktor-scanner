name: Signal journal scan

# Runs the scanner headlessly so the journal records the market rather than
# the owner's browsing hours. Verified live (2026-08-29): an 11-hour gap
# with nobody browsing meant zero new signals AND zero resolutions in that
# window, regardless of what the market did.
#
# GitHub's scheduler is best-effort: 5 minutes is the floor, and runs are
# routinely delayed or skipped when the platform is busy. That is acceptable
# here — a missed run loses one sampling opportunity, and the unique key on
# (symbol, market, direction, bar_time) means a late or duplicated run
# cannot double-count. It is NOT a guarantee of even 5-minute spacing, so
# nothing downstream should assume a fixed cadence.
#
# Note: GitHub disables scheduled workflows in repos with no commit activity
# for 60 days. If the journal goes quiet, check that before debugging code.
#
# ---------------------------------------------------------------------------
# THIS NO LONGER RUNS tools/cron-scan.js DIRECTLY. Bybit 403s every request
# from GitHub's hosted runners (measured, both api.bybit.com and
# api.bytick.com — the runner's US cloud IP is blocked, not one bad
# hostname). The scan logic is correct and runs fine anywhere Bybit
# answers; it simply cannot run on THIS network.
#
# Instead this workflow just makes ONE HTTPS call to a Supabase Edge
# Function (supabase/functions/cron-scan) that runs the identical scan
# logic. js/indicators.js, js/scoring.js and js/signals.js needed one
# addition each (a `globalThis` bridge, since Deno gives every ES module
# its own scope) but no rewrite — confirmed by direct probe before
# building the real function.
#
# THE x-region HEADER IS NOT OPTIONAL. Supabase Edge Functions route to
# whichever region is closest to the CALLER by default, not to the
# project's home region — measured directly: an invocation forced to
# us-east-1 hit the SAME "no reachable Bybit host" failure GitHub's own
# runners get (a US-cloud IP block), while ap-northeast-1 (this project's
# actual region, confirmed to reach Bybit) succeeded every time. GitHub's
# runners are US-based, so without this header they'd silently route to a
# blocked region and this fix would appear to work in manual testing (from
# a different origin) while failing on the real schedule.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      universe_size:
        description: 'Coins per category to scan'
        required: false
        default: '120'
      dry_run:
        description: 'Score without writing (1 = dry run)'
        required: false
        default: '0'

# A slow run must never stack on top of the next scheduled one — two
# concurrent scans would just contend for the same rows.
concurrency:
  group: signal-journal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke cron-scan Edge Function
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNIVERSE_SIZE: ${{ github.event.inputs.universe_size || '120' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: |
          url="https://fpyfetynfobfrpunnnhv.supabase.co/functions/v1/cron-scan?universe_size=${UNIVERSE_SIZE}"
          if [ "$DRY_RUN" = "1" ]; then url="${url}&dry_run=1"; fi
          http_code=$(curl -s -o response.json -w "%{http_code}" "$url" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "x-region: ap-northeast-1")
          cat response.json
          echo ""
          if [ "$http_code" != "200" ]; then
            echo "cron-scan returned HTTP $http_code"
            exit 1
          fi
