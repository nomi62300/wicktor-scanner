name: Keep Supabase warm

# Free-tier Supabase projects auto-pause after 7 days with no API activity.
# The CMC proxy is only invoked when CoinGecko fails, which is irregular —
# a quiet stretch could pause the project right when the fallback is
# actually needed. Pinging every 3 days keeps comfortable margin under the
# 7-day threshold without spending any CMC credits (the function's `ping`
# path returns immediately, no upstream call).

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Edge Function
        run: curl -sf "https://fpyfetynfobfrpunnnhv.supabase.co/functions/v1/cmc-proxy?path=ping"
